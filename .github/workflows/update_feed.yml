# Название задачи автоматизации, которое отображается во вкладке Actions
name: Update Online Store XML Feeds

on:
  schedule:
    # Автоматический запуск каждый день в 01:00 по UTC (04:00 по Москве)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Меню параметров при ручном нажатии кнопки Run workflow
    inputs:
      debug_mode:
        description: 'Включить режим отладки (тест на нескольких товарах, запись в лог отключена)'
        type: boolean
        default: false
      debug_limit:
        description: 'Сколько позиций каждого бренда проверять в режиме отладки'
        type: number
        default: 3

jobs:
  build:
    # Сервер на базе Linux, на котором будет выполняться скрипт
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачиваем файлы вашего репозитория на временный сервер
      - name: Checkout repository
        uses: actions/checkout@v3

      # Шаг 2: Устанавливаем Python версии 3.10
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Шаг 3: Устанавливаем нужные библиотеки из файла requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4: Запускаем наш главный универсальный скрипт main.py
      - name: Run Python script
        env:
          API_EMAIL: ${{ secrets.API_EMAIL }}
          API_KEY: ${{ secrets.API_KEY }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          DEBUG_LIMIT: ${{ github.event.inputs.debug_limit }}
        run: python main.py

      # Шаг 5: Сохраняем сгенерированные XML-файлы, кэш PDF и папку с логами обратно в репозиторий
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feedChipdip.xml
          git add feedChipdip-ZEROwarehouse.xml
          git add feedStoking.xml
          git add feedStoking-ZEROwarehouse.xml
          if [ -f "pdf_cache.json" ]; then
            git add pdf_cache.json
          fi
          # Проверяем, существует ли папка logs (в режиме отладки она не создается)
          if [ -d "logs" ]; then
            git add logs/
          fi
          git commit -m "Авто-обновление XML-фидов и лога цен/остатков" || echo "Нет изменений для коммита"
          git push
